name: Google Drive APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP file URL"
        required: true
        type: string

      release_tag:
        description: "Build Label"
        required: true
        default: "latest-build"
        type: string

permissions: {}

jobs:
  build:
    name: Download and Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Setup SSH Authentication
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret missing!"
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          ssh -T git@github.com || true

      # 2. Clone Repository Using SSH
      - name: Clone Repository
        run: |
          git clone \
            --branch "$GITHUB_REF_NAME" \
            "git@github.com:${GITHUB_REPOSITORY}.git" \
            repo

          echo "Repository cloned successfully!"

      # 3. Setup Java
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Setup Android SDK
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $ANDROID_HOME"

      # 5. Install Android SDK Packages
      - name: Install Android SDK Packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          yes | "$SDKMANAGER" --licenses

      # 6. Install Download Tools
      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      # 7. Download Google Drive ZIP
      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          if [ -z "$DRIVE_URL" ]; then
            echo "Google Drive URL is missing!"
            exit 1
          fi

          gdown "$DRIVE_URL" -O source.zip

          if [ ! -s source.zip ]; then
            echo "ZIP download failed!"
            exit 1
          fi

          if ! unzip -tq source.zip; then
            echo "Invalid ZIP file!"
            exit 1
          fi

          echo "Download successful!"

      # 8. Extract Source ZIP
      - name: Extract Source Code
        run: |
          mkdir -p source

          unzip -q source.zip -d source

          echo "ZIP extracted!"

          find source -maxdepth 3 -type f | head -100

      # 9. Locate Android Project
      - name: Locate Android Project
        run: |
          echo "Searching Android project..."

          PROJECT_DIR=""

          GRADLE_FILE=$(find source \
            -type f \
            -name gradlew \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -n "$GRADLE_FILE" ]; then
            PROJECT_DIR=$(dirname "$GRADLE_FILE")
            chmod +x "$GRADLE_FILE"

          else
            SETTINGS_FILE=$(find source \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path "*/.gradle/*" \
              | head -n 1)

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            else
              BUILD_FILE=$(find source \
                -type f \
                \( -name build.gradle -o -name build.gradle.kts \) \
                -not -path "*/.gradle/*" \
                | head -n 1)

              if [ -n "$BUILD_FILE" ]; then
                PROJECT_DIR=$(dirname "$BUILD_FILE")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      # 10. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 11. Build Debug APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      # 12. Collect APK Files
      - name: Collect APK Files
        run: |
          mkdir -p output

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*" \
            -name "*.apk" \
            -exec cp --parents {} output/ \;

          if ! find output -name "*.apk" | grep -q .; then
            echo "ERROR: No APK generated!"
            exit 1
          fi

          echo "Generated APK files:"
          find output -name "*.apk"

      # 13. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: output/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Prepare Release Folder
      - name: Prepare Release
        run: |
          mkdir -p repo/release

          find output \
            -type f \
            -name "*.apk" \
            | while read -r apk; do
              cp "$apk" "repo/release/$(basename "$apk")"
            done

          echo "APK files prepared:"
          ls -lh repo/release/

      # 15. Commit and Push APK Using SSH
      - name: Commit and Push APK
        run: |
          cd repo

          git config user.name "APK Builder"
          git config user.email "apk-builder@users.noreply.github.com"

          git add -A release/

          if git diff --cached --quiet; then
            echo "No APK changes detected."
          else
            git commit -m "chore: update APK build [skip ci]"

            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "APK committed and pushed successfully!"
          fi

      # 16. Build Summary
      - name: Build Summary
        if: success()
        run: |
          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"
          echo "Build Label: ${{ inputs.release_tag }}"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "APK Location: release/"
          echo "Commit & Push: Completed"
          echo "================================"
